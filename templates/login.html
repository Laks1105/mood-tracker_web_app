<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Tracker — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- ===================== HERO / MOOD INTRO ===================== -->
  <section class="hero">
    <div class="hero-glow"></div>

    <svg id="face" viewBox="0 0 200 200" width="180" height="180">
      <circle id="face-outline" cx="100" cy="100" r="88" />
      <g id="eyes"></g>
      <path id="mouth" d="" />
    </svg>

    <p id="mood-label" class="mood-label">&nbsp;</p>

    <div class="scroll-cue" id="scrollCue">
      <span>Scroll down to log in</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </section>

  <!-- ===================== LOGIN ===================== -->
  <section class="login-section" id="login">
    <div class="login-container">
      <h2>Welcome back</h2>
      <p class="login-sub">Log in to check in on your mood</p>

      <form action="/login" method="POST">
        <div class="input-group">
          <label for="Email">Email</label>
          <input type="text" id="Email" name="Email" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>

        {% if error %}
          <p class="error-message">{{ error }}</p>
        {% endif %}

        <button type="submit">Login</button>
      </form>
      <p class="register-link">Don't have an account? <a href="register">Register Here</a></p>
    </div>
  </section>

  <script src="{{ url_for('static', filename='animation.js') }}"></script>
</body>
</html>
